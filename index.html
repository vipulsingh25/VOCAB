<style>
  :root {
    --bg: #0f172a;

    --wrong-bg: #7f1d1d;
    --wrong-border: #ef4444;
    --missed-border: #f59e0b;
    --option-bg: #334155;
    --option-hover: #475569;
    --syn-color: #34d399;
    --ant-color: #f87171;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
  .quiz-card { background: var(--card-bg); width: 100%; max-width: 720px; border-radius: 16px; padding: 32px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5); }
  .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; padding-bottom: 16px; margin-bottom: 24px; }
  .progress { font-size: 0.9rem; color: var(--accent); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }
  .score { font-size: 0.9rem; color: var(--text-muted); }
  .question-box { margin-bottom: 24px; }
  .word-title { font-size: 2rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .pos-tag { display: inline-block; font-size: 0.8rem; background: #0284c7; color: #fff; padding: 2px 8px; border-radius: 4px; margin-bottom: 12px; }
  .prompt-text { font-size: 1.05rem; color: var(--text-muted); margin-bottom: 16px; }
  .options-grid { display: flex; flex-direction: column; gap: 10px; margin-bottom: 24px; }
  .option-label { display: flex; align-items: center; padding: 14px 18px; border-radius: 8px; background: var(--option-bg); cursor: pointer; transition: all 0.2s; border: 2px solid transparent; user-select: none; }
  .option-label:hover { background: var(--option-hover); }
  .option-label input { margin-right: 14px; width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
  .option-text { font-size: 1rem; flex: 1; }
  
  /* State Styles */
  .option-label.selected { border-color: var(--accent); background: #1e3a5f; }
  .option-label.correct { background: var(--correct-bg) !important; border-color: var(--correct-border) !important; }
  .option-label.wrong { background: var(--wrong-bg) !important; border-color: var(--wrong-border) !important; }
  .option-label.missed { border-color: var(--missed-border) !important; }

  /* Explanation / Active Recall Box */
  .explanation-box { background: #0b132b; border-left: 4px solid var(--accent); padding: 18px; border-radius: 0 8px 8px 0; margin-bottom: 24px; display: none; }
  .explanation-title { font-weight: 700; color: var(--accent); margin-bottom: 10px; font-size: 1rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .recall-grid { display: flex; flex-direction: column; gap: 8px; font-size: 0.92rem; line-height: 1.5; }
  .recall-row { display: flex; flex-direction: column; }
  .recall-label { font-weight: 600; color: #cbd5e1; }
  .tag-syn { color: var(--syn-color); font-weight: 600; }
  .tag-ant { color: var(--ant-color); font-weight: 600; }

  .actions { display: flex; justify-content: flex-end; gap: 12px; }
  button { padding: 12px 24px; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s; }
  .btn-submit { background: var(--accent); color: #0f172a; }
  .btn-submit:hover { opacity: 0.9; }
  .btn-next { background: #10b981; color: #fff; display: none; }
  .btn-next:hover { opacity: 0.9; }
</style>
</head>

<div class="quiz-card" id="quizCard">

    <div class="recall-grid" id="explanationContent"></div>
  </div>

  <div class="actions">
    <button class="btn-submit" id="btnSubmit" onclick="checkAnswer()">Submit</button>
    <button class="btn-next" id="btnNext" onclick="nextQuestion()">Next Question &rarr;</button>
  </div>
</div>

  },
  {
    word: "Naive",

      { text: "Noob, Beginner & Inexperienced", correct: true },

      { text: "Ingenuous, Credulous & Gullible", correct: true },

    ],

    antonyms: "Sophisticated, Astute, Shrewd, Experienced, Worldly, Sagacious."
  }

// Utility: Fisher-Yates shuffle
function shuffleArray(array) {
  const shuffled = [...array];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

let activeQuizData = [];
let currentIndex = 0;
let score = 0;

function initQuiz() {
  // Randomize questions order
  const shuffledQuestions = shuffleArray(rawQuizData);
  
  // Randomize options within each question
  activeQuizData = shuffledQuestions.map(q => ({
    ...q,
    options: shuffleArray(q.options)
  }));

  currentIndex = 0;
  score = 0;
  loadQuestion();
}

function loadQuestion() {
  const q = activeQuizData[currentIndex];
  document.getElementById('progressText').innerText = `Question ${currentIndex + 1} of ${activeQuizData.length}`;
  document.getElementById('scoreText').innerText = `Score: ${score}`;
  document.getElementById('targetWord').innerText = q.word;
  document.getElementById('posTag').innerText = q.pos;
  document.getElementById('promptText').innerText = q.prompt;
  
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';

  q.options.forEach((opt, idx) => {
    const label = document.createElement('label');
    label.className = 'option-label';
    label.id = `opt-label-${idx}`;
    label.innerHTML = `
      <input type="checkbox" id="opt-${idx}" value="${idx}" onchange="toggleSelect(${idx})">
      <span class="option-text">${opt.text}</span>
    `;
    container.appendChild(label);
  });

  document.getElementById('explanationBox').style.display = 'none';
  document.getElementById('btnSubmit').style.display = 'inline-block';
  document.getElementById('btnNext').style.display = 'none';
}

function toggleSelect(idx) {
  const label = document.getElementById(`opt-label-${idx}`);
  const input = document.getElementById(`opt-${idx}`);
  if (input.checked) {
    label.classList.add('selected');
  } else {
    label.classList.remove('selected');
  }
}

function checkAnswer() {
  const q = activeQuizData[currentIndex];
  let allCorrect = true;

  q.options.forEach((opt, idx) => {
    const input = document.getElementById(`opt-${idx}`);
    const label = document.getElementById(`opt-label-${idx}`);
    input.disabled = true;

    if (opt.correct) {
      if (input.checked) {
        label.classList.add('correct');
      } else {
        label.classList.add('missed');
        allCorrect = false;
      }
    } else {
      if (input.checked) {
        label.classList.add('wrong');
        allCorrect = false;
      }
    }
  });

  if (allCorrect) score++;

  const expBox = document.getElementById('explanationBox');
  document.getElementById('explanationContent').innerHTML = `
    <div class="recall-row"><span class="recall-label">💡 Meaning:</span> <span>${q.simpleMeaning}</span></div>
    <div class="recall-row"><span class="recall-label tag-syn">✔ Key CDS Synonyms:</span> <span>${q.synonyms}</span></div>
    <div class="recall-row"><span class="recall-label tag-ant">✖ Key CDS Antonyms:</span> <span>${q.antonyms}</span></div>
  `;
  expBox.style.display = 'block';

  document.getElementById('btnSubmit').style.display = 'none';
  document.getElementById('btnNext').style.display = 'inline-block';
  document.getElementById('scoreText').innerText = `Score: ${score}`;
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < activeQuizData.length) {
    loadQuestion();
  } else {
    showFinalResults();
  }
}

function showFinalResults() {
  const card = document.getElementById('quizCard');
  card.innerHTML = `
    <div style="text-align: center; padding: 20px 0;">
      <h2 style="font-size: 2.2rem; margin-bottom: 12px; color: #fff;">Quiz Completed!</h2>
      <p style="font-size: 1.2rem; color: var(--text-muted); margin-bottom: 24px;">Your Final Score: <strong style="color: var(--accent);">${score} / ${activeQuizData.length}</strong></p>
      <button class="btn-submit" onclick="initQuiz()">Restart Quiz (Shuffle Again)</button>
    </div>
  `;
}

// Initial Run
initQuiz();
</script>
