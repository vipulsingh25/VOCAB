    ],
    simpleMeaning: "An acquired or natural skill at performing a task (कौशल / हुनर).",
    synonyms: "Adroitness, Dexterity, Aptitude, Flair, Ingenuity, Prowess, Deftness.",
    antonyms: "Ineptitude, Clumsiness, Incompetence, Gaucheness, Inability."
  },
  {
    word: "Naive",
    pos: "Adjective",
    prompt: "Select ALL valid synonyms for Naive:",
    options: [
      { text: "Noob, Beginner & Inexperienced", correct: true },
      { text: "Jejune, Immature & Callow", correct: true },
      { text: "Ingenuous, Credulous & Gullible", correct: true },
      { text: "Astute, Shrewd & Sagacious", correct: false }
    ],
    simpleMeaning: "Lacking worldly wisdom, experience, or judgment (अनुभवहीन / सीधा-सादा).",
    synonyms: "Callow, Jejune, Ingenuous, Gullible, Novice, Greenhorn, Credulous.",
    antonyms: "Sophisticated, Astute, Shrewd, Experienced, Worldly, Sagacious."
  }
];

// Utility: Fisher-Yates shuffle
function shuffleArray(array) {
  const shuffled = [...array];
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled;
}

let activeQuizData = [];
let currentIndex = 0;
let score = 0;

function initQuiz() {
  // Randomize questions order
  const shuffledQuestions = shuffleArray(rawQuizData);
  
  // Randomize options within each question
  activeQuizData = shuffledQuestions.map(q => ({
    ...q,
    options: shuffleArray(q.options)
  }));

  currentIndex = 0;
  score = 0;
  loadQuestion();
}

function loadQuestion() {
  const q = activeQuizData[currentIndex];
  document.getElementById('progressText').innerText = `Question ${currentIndex + 1} of ${activeQuizData.length}`;
  document.getElementById('scoreText').innerText = `Score: ${score}`;
  document.getElementById('targetWord').innerText = q.word;
  document.getElementById('posTag').innerText = q.pos;
  document.getElementById('promptText').innerText = q.prompt;
  
  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';

  q.options.forEach((opt, idx) => {
    const label = document.createElement('label');
    label.className = 'option-label';
    label.id = `opt-label-${idx}`;
    label.innerHTML = `
      <input type="checkbox" id="opt-${idx}" value="${idx}" onchange="toggleSelect(${idx})">
      <span class="option-text">${opt.text}</span>
    `;
    container.appendChild(label);
  });

  document.getElementById('explanationBox').style.display = 'none';
  document.getElementById('btnSubmit').style.display = 'inline-block';
  document.getElementById('btnNext').style.display = 'none';
}

function toggleSelect(idx) {
  const label = document.getElementById(`opt-label-${idx}`);
  const input = document.getElementById(`opt-${idx}`);
  if (input.checked) {
    label.classList.add('selected');
  } else {
    label.classList.remove('selected');
  }
}

function checkAnswer() {
  const q = activeQuizData[currentIndex];
  let allCorrect = true;

  q.options.forEach((opt, idx) => {
    const input = document.getElementById(`opt-${idx}`);
    const label = document.getElementById(`opt-label-${idx}`);
    input.disabled = true;

    if (opt.correct) {
      if (input.checked) {
        label.classList.add('correct');
      } else {
        label.classList.add('missed');
        allCorrect = false;
      }
    } else {
      if (input.checked) {
        label.classList.add('wrong');
        allCorrect = false;
      }
    }
  });

  if (allCorrect) score++;

  const expBox = document.getElementById('explanationBox');
  document.getElementById('explanationContent').innerHTML = `
    <div class="recall-row"><span class="recall-label">💡 Meaning:</span> <span>${q.simpleMeaning}</span></div>
    <div class="recall-row"><span class="recall-label tag-syn">✔ Key CDS Synonyms:</span> <span>${q.synonyms}</span></div>
    <div class="recall-row"><span class="recall-label tag-ant">✖ Key CDS Antonyms:</span> <span>${q.antonyms}</span></div>
  `;
  expBox.style.display = 'block';

  document.getElementById('btnSubmit').style.display = 'none';
  document.getElementById('btnNext').style.display = 'inline-block';
  document.getElementById('scoreText').innerText = `Score: ${score}`;
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < activeQuizData.length) {
    loadQuestion();
  } else {
    showFinalResults();
  }
}

function showFinalResults() {
  const card = document.getElementById('quizCard');
  card.innerHTML = `
    <div style="text-align: center; padding: 20px 0;">
      <h2 style="font-size: 2.2rem; margin-bottom: 12px; color: #fff;">Quiz Completed!</h2>
      <p style="font-size: 1.2rem; color: var(--text-muted); margin-bottom: 24px;">Your Final Score: <strong style="color: var(--accent);">${score} / ${activeQuizData.length}</strong></p>
      <button class="btn-submit" onclick="initQuiz()">Restart Quiz (Shuffle Again)</button>
    </div>
  `;
}

<!DOCTYPE html>
<html lang="en">

<style>

  .option-label:hover { background: var(--option-hover); transform: translateY(-1px); }

  .option-label.missed { border-color: var(--missed-border) !important; background: rgba(245, 158, 11, 0.1) !important; }

  /* Recall Breakdown */
  .explanation-box { background: #080c14; border-left: 4px solid var(--accent); padding: 20px; border-radius: 0 10px 10px 0; margin-bottom: 24px; display: none; }
  .explanation-title { font-weight: 700; color: var(--accent); margin-bottom: 12px; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .recall-grid { display: flex; flex-direction: column; gap: 10px; font-size: 0.95rem; line-height: 1.6; }
  .recall-row { display: flex; flex-direction: column; }
  .recall-label { font-weight: 600; color: #e2e8f0; }
  .tag-syn { color: var(--syn-color); }
  .tag-ant { color: var(--ant-color); }

  .actions { display: flex; justify-content: space-between; align-items: center; }
  button { padding: 13px 26px; border: none; border-radius: 8px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s; }
  .btn-submit { background: var(--accent); color: #0b0f19; margin-left: auto; }
  .btn-submit:hover { opacity: 0.9; }
  .btn-next { background: #10b981; color: #fff; margin-left: auto; display: none; }
  .btn-next:hover { opacity: 0.9; }
  .btn-shuffle { background: #334155; color: #cbd5e1; font-size: 0.9rem; padding: 10px 18px; }
  .btn-shuffle:hover { background: #475569; color: #fff; }
</style>
</head>
<body>

<div class="quiz-card" id="quizCard">
  <div class="header">
    <span class="progress" id="progressText">Question 1</span>
    <span class="score" id="scoreText">Score: 0</span>
  </div>

  <div class="question-box">
    <div class="target-label">Target Vocab Pivot</div>
    <div class="word-title" id="targetWord">---</div>
    <span class="prompt-badge" id="promptBadge">Synonym Discovery</span>
    <div class="prompt-text" id="promptText">Select ALL valid associated synonyms / related terms:</div>
  </div>

  <div class="options-grid" id="optionsContainer"></div>

  <div class="explanation-box" id="explanationBox">
    <div class="explanation-title">Active Recall & Context Breakdown</div>
    <div class="recall-grid" id="explanationContent"></div>
  </div>

  <div class="actions">
    <button class="btn-shuffle" onclick="restartQuiz()">🔀 Reshuffle All</button>
    <button class="btn-submit" id="btnSubmit" onclick="checkAnswer()">Submit</button>
    <button class="btn-next" id="btnNext" onclick="nextQuestion()">Next Question &rarr;</button>
  </div>
</div>

<script>
// Master Semantic Clusters (Words rotate between Question & Options dynamically)
const vocabClusters = [
  {
    clusterName: "Defense, Cover & Justification",
    hindiCue: "अन्यत्र उपस्थित, बहाना या बचाव",
    words: ["Alibi", "Vindication", "Shield", "Protection", "Excuse", "Defense Plea", "Justification"],
    antonyms: ["Accusation", "Incrimination", "Inculpation", "Implication"],
    note: "Evidence or defense that proves innocence or protects from blame."
  },
  {
    clusterName: "Abolish, Cancel & Annul",
    hindiCue: "खारिज कर देना / रद्द करना",
    words: ["Abrogate", "Repeal", "Rescind", "Revoke", "Quash", "Nullify", "Repudiate", "Annul"],
    antonyms: ["Enact", "Ratify", "Validate", "Sanction", "Establish", "Institute"],
    note: "To officially cancel, abolish or revoke a law/order (e.g., Article 370)."
  },
  {
    clusterName: "Amass, Accumulate & Aggregate",
    hindiCue: "जमा होना / इकट्ठा करना",
    words: ["Accrue", "Accumulate", "Amass", "Hoard", "Muster", "Collate", "Pile up", "Lay up"],
    antonyms: ["Dwindle", "Dissipate", "Disperse", "Deplete", "Diminish"],
    note: "To accumulate or grow gradually over time (Accrue interest/points). Horde = crowd."
  },
  {
    clusterName: "Obstinate, Stubborn & Inflexible",
    hindiCue: "ज़िद्दी / हठी / अटूट",
    words: ["Adamant", "Obstinate", "Inexorable", "Intransigent", "Pig-headed", "Obdurate", "Dogged"],
    antonyms: ["Pliant", "Yielding", "Flexible", "Tractable", "Compliant"],
    note: "Unshakable, stubborn, or refusing to alter a position."
  },
  {
    clusterName: "Flattery, Fawning & Sycophancy",
    hindiCue: "चापलूसी / झूठी प्रशंसा",
    words: ["Adulation", "Sycophancy", "Blandishment", "Obsequiousness", "Flattery", "Cajolery", "Inveigle"],
    antonyms: ["Invective", "Vilification", "Denunciation", "Opprobrium", "Criticism"],
    note: "Excessive flattery/admiration. Note: Inveigh = criticize strongly."
  },
  {
    clusterName: "Mournful, Gloomy & Tearful",
    hindiCue: "Sad hona / रोना-धोना / उदास",
    words: ["Lachrymose", "Maudlin", "Lugubrious", "Dolorous", "Sorrowful", "Mournful", "Weepy", "Ululation"],
    antonyms: ["Cheerful", "Jocund", "Sanguine", "Buoyant", "Exuberant", "Jovial"],
    note: "Expressing sorrow or tending to weep easily."
  },
  {
    clusterName: "Restraints, Fetters & Confinement",
    hindiCue: "बँधी / बेड़ियां / बंधन",
    words: ["Manacles", "Fetters", "Shackles", "Handcuffs", "Bondage", "Confinement", "Enchain"],
    antonyms: ["Emancipate", "Liberate", "Unfetter", "Disenthrall", "Release"],
    note: "Physical restraints on freedom or hands/feet."
  },
  {
    clusterName: "Courage, Resilience & Spirit",
    hindiCue: "साहस / मानसिक शक्ति / हिम्मत",
    words: ["Mettle", "Fortitude", "Valour", "Tenacity", "Audacity", "Pluck", "Grit"],
    antonyms: ["Pusillanimity", "Cowardice", "Timidity", "Cravenness", "Feebleness"],
    note: "Coping with difficulty with spirit, courage, and resilience."
  },
  {
    clusterName: "Skill, Dexterity & Mastery",
    hindiCue: "कौशल / हुनर / दक्षता",
    words: ["Knack", "Adroitness", "Dexterity", "Aptitude", "Flair", "Ingenuity", "Deftness"],
    antonyms: ["Ineptitude", "Clumsiness", "Gaucheness", "Incompetence"],
    note: "A special talent or natural skill for doing something."
  },
  {
    clusterName: "Inexperienced, Callow & Immature",
    hindiCue: "अनुभवहीन / सीधा-सादा / नौसिखिया",
    words: ["Naive", "Callow", "Jejune", "Ingenuous", "Credulous", "Gullible", "Greenhorn"],
    antonyms: ["Astute", "Shrewd", "Sagacious", "Sophisticated", "Worldly"],
    note: "Lacking experience, sophisticated knowledge, or judgment."
  },
  {
    clusterName: "Dishonest, Scoundrel & Deceiver",
    hindiCue: "धूर्त / ठग / बदमाश",
    words: ["Knave", "Swindler", "Charlatan", "Scoundrel", "Rogue", "Dupe master", "Hypocrite"],
    antonyms: ["Paragon", "Saint", "Philanthropist", "Upright person"],
    note: "A dishonest, unscrupulous villain. Swindle = cheat, Dwindle = decrease."
  },
  {
    clusterName: "Adversary, Rival & Opponent",
    hindiCue: "विरोधी / प्रतिद्वंद्वी",
    words: ["Antagonist", "Opponent", "Adversary", "Nemesis", "Rival", "Foe", "Combatant"],
    antonyms: ["Protagonist", "Ally", "Supporter", "Collaborator", "Champion"],
    note: "A person who opposes or competes against another."
  }
];

// Fisher-Yates array shuffling
function shuffle(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

// Generate dynamic cross-pivot questions
function generateDynamicQuiz() {
  const shuffledClusters = shuffle(vocabClusters);
  const questions = [];

  shuffledClusters.forEach((cluster, cIndex) => {
    // 1. Pick a random word from this cluster as the target question
    const shuffledWords = shuffle(cluster.words);
    const target = shuffledWords[0];
    
    // 2. Pick 2-3 other words from the same cluster as CORRECT synonyms
    const correctSynonyms = shuffledWords.slice(1, 3 + Math.floor(Math.random() * 2));
    
    // 3. Pick 1-2 distractors from OTHER clusters or Antonynms
    const otherClusters = vocabClusters.filter((_, idx) => idx !== cIndex);
    const randomOtherCluster = otherClusters[Math.floor(Math.random() * otherClusters.length)];
    const distractorWord = shuffle(randomOtherCluster.words)[0];
    const distractorAntonym = shuffle(cluster.antonyms)[0];

    const options = [
      ...correctSynonyms.map(word => ({ text: word, correct: true })),
      { text: distractorWord, correct: false },
      { text: distractorAntonym, correct: false }
    ];

    questions.push({
      targetWord: target,
      clusterName: cluster.clusterName,
      hindiCue: cluster.hindiCue,
      note: cluster.note,
      synonyms: cluster.words.filter(w => w !== target).join(", "),
      antonyms: cluster.antonyms.join(", "),
      options: shuffle(options)
    });
  });

  return questions;
}

let activeQuiz = [];
let currentIndex = 0;
let score = 0;

function restartQuiz() {
  activeQuiz = generateDynamicQuiz();
  currentIndex = 0;
  score = 0;
  loadCurrentQuestion();
}

function loadCurrentQuestion() {
  const q = activeQuiz[currentIndex];
  document.getElementById('progressText').innerText = `Question ${currentIndex + 1} of ${activeQuiz.length}`;
  document.getElementById('scoreText').innerText = `Score: ${score}`;
  document.getElementById('targetWord').innerText = q.targetWord;
  document.getElementById('promptBadge').innerText = `Cluster: ${q.clusterName}`;
  document.getElementById('promptText').innerText = `Select ALL valid matching synonyms / associated terms (2 or more may apply):`;

  const container = document.getElementById('optionsContainer');
  container.innerHTML = '';

  q.options.forEach((opt, idx) => {
    const label = document.createElement('label');
    label.className = 'option-label';
    label.id = `opt-label-${idx}`;
    label.innerHTML = `
      <input type="checkbox" id="opt-${idx}" value="${idx}" onchange="toggleOptionSelect(${idx})">
      <span class="option-text">${opt.text}</span>
    `;
    container.appendChild(label);
  });

  document.getElementById('explanationBox').style.display = 'none';
  document.getElementById('btnSubmit').style.display = 'inline-block';
  document.getElementById('btnNext').style.display = 'none';
}

function toggleOptionSelect(idx) {
  const label = document.getElementById(`opt-label-${idx}`);
  const input = document.getElementById(`opt-${idx}`);
  if (input.checked) {
    label.classList.add('selected');
  } else {
    label.classList.remove('selected');
  }
}

function checkAnswer() {
  const q = activeQuiz[currentIndex];
  let allCorrect = true;

  q.options.forEach((opt, idx) => {
    const input = document.getElementById(`opt-${idx}`);
    const label = document.getElementById(`opt-label-${idx}`);
    input.disabled = true;

    if (opt.correct) {
      if (input.checked) {
        label.classList.add('correct');
      } else {
        label.classList.add('missed');
        allCorrect = false;
      }
    } else {
      if (input.checked) {
        label.classList.add('wrong');
        allCorrect = false;
      }
    }
  });

  if (allCorrect) score++;

  const expBox = document.getElementById('explanationBox');
  document.getElementById('explanationContent').innerHTML = `
    <div class="recall-row"><span class="recall-label">💡 Hindi Cue & Core Meaning:</span> <span>${q.hindiCue} — ${q.note}</span></div>
    <div class="recall-row"><span class="recall-label tag-syn">✔ Full Synonym Cluster:</span> <span>${q.synonyms}</span></div>
    <div class="recall-row"><span class="recall-label tag-ant">✖ Opposites / Antonyms:</span> <span>${q.antonyms}</span></div>
  `;
  expBox.style.display = 'block';

  document.getElementById('btnSubmit').style.display = 'none';
  document.getElementById('btnNext').style.display = 'inline-block';
  document.getElementById('scoreText').innerText = `Score: ${score}`;
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex < activeQuiz.length) {
    loadCurrentQuestion();
  } else {
    showFinalResults();
  }
}

function showFinalResults() {
  const card = document.getElementById('quizCard');
  card.innerHTML = `
    <div style="text-align: center; padding: 24px 0;">
      <h2 style="font-size: 2.2rem; margin-bottom: 12px; color: #fff;">Quiz Completed! 🎯</h2>
      <p style="font-size: 1.2rem; color: var(--text-muted); margin-bottom: 28px;">Your Final Score: <strong style="color: var(--accent);">${score} / ${activeQuiz.length}</strong></p>
      <button class="btn-submit" style="margin: 0 auto; display: block;" onclick="restartQuiz(); location.reload();">🔀 Reshuffle & Start New Round</button>
    </div>
  `;
}

// Initial Boot
restartQuiz();
</script>
